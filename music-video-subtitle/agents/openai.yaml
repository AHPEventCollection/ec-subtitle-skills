  short_description: "官方字幕、网易云歌词对照的MV双语字幕、发布包与待提交检查"
  default_prompt: "使用$music-video-subtitle完成这支MV，官方字幕提供日文正文、顺序和初始时间轴，仍查询网易云日中歌词并复核早晚入点；机器初稿先校准完整一番或二番，再按结构与4拍/8拍音频线索推广到其他歌词段；YouTube来源直接采用本支视频缩略图并与压制并行准备，保持原尺寸、构图与比例，不搜索歌曲封面、不从视频截图，候选确认后一次交付视频、字幕、封面、文字与完整状态检查"
