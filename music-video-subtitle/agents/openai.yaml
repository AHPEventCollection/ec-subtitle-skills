interface:
  display_name: "单曲MV双语字幕"
  short_description: "MV双语字幕、编辑器波形、B站歌词弹幕及多平台文案、制作署名交付"
  default_prompt: "使用$music-video-subtitle按本次请求选择MV字幕、B站歌词弹幕或平台文案分支。完整MV任务先取得片源、核对歌词与时间轴，首次候选交付前用waveform入口生成同名真实音轨波形，候选经确认后出片；复用官方视频缩略图并保留原素材，封面按项目规格交付。文案保留实际模型和ec-subtitle-skills署名，Token与耗时按规范选填，不设制作署名门禁；单曲MV不准备或提醒章节，归档按操作人员指令执行，无制作完成度前置，未完成的验收与发布状态如实保留"
