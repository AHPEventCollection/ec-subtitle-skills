interface:
  display_name: "单曲MV双语字幕"
  short_description: "MV双语字幕、B站歌词弹幕及多平台文案、制作署名和章节评论交付"
  default_prompt: "使用$music-video-subtitle按本次请求选择MV字幕、B站歌词弹幕或平台文案分支。完整MV任务先取得片源、核对歌词与时间轴，候选经确认后出片；复用官方视频缩略图并保留原素材，封面按项目规格交付。文案包含真实模型、Token用量与口径、耗时和ec-subtitle-skills署名，三平台另附章节评论，B站简介不放章节表；发布时提醒编辑章节并核对开场和结束，未完成的人工验收与平台保存状态如实保留"
